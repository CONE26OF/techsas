# =============================================================
# TechSAS Enterprise Stack — Master Docker Compose
# =============================================================
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d
#
# Individual stacks can be started separately:
#   docker compose -f docker-compose.yml -f stacks/chat.yml up -d
# =============================================================

include:
  - stacks/infrastructure.yml
  - stacks/storage.yml
  - stacks/chat.yml
  - stacks/support.yml
  - stacks/security.yml
  - stacks/productivity.yml
  - stacks/monitoring.yml

networks:
  proxy:
    name: techsas_proxy
    driver: bridge
  internal:
    name: techsas_internal
    driver: bridge
    internal: true

volumes:
  traefik_letsencrypt:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:

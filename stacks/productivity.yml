# =============================================================
# Productivity: Plane (projects) + ERPNext (ERP/GST) +
#              Flexprice (SaaS billing)
# =============================================================

services:

  # ── Plane (project management, AGPL-3.0) ─────────────────────
  plane-web:
    image: makeplane/plane-frontend:stable
    container_name: plane-web
    restart: unless-stopped
    command: /usr/local/bin/start.sh web/server.js web
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://projects.${BASE_DOMAIN}
      NEXT_PUBLIC_DEPLOY_URL: https://projects.${BASE_DOMAIN}
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane.rule=Host(`projects.${BASE_DOMAIN}`)"
      - "traefik.http.routers.plane.entrypoints=websecure"
      - "traefik.http.routers.plane.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane.loadbalancer.server.port=3000"

  plane-api:
    image: makeplane/plane-backend:stable
    container_name: plane-api
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${PLANE_SECRET_KEY}
      DATABASE_URL: postgresql://plane:${PLANE_DB_PASSWORD}@postgres:5432/plane
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ALLOWED_ORIGINS: https://projects.${BASE_DOMAIN}
      WEB_URL: https://projects.${BASE_DOMAIN}
      FILE_SIZE_LIMIT: "5242880"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_BUCKET_NAME: plane-uploads
      USE_MINIO: "1"
      MEDIA_URL: https://s3.${BASE_DOMAIN}/plane-uploads/
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plane-api.rule=Host(`projects.${BASE_DOMAIN}`) && PathPrefix(`/api/`, `/auth/`)"
      - "traefik.http.routers.plane-api.entrypoints=websecure"
      - "traefik.http.routers.plane-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-api.loadbalancer.server.port=8000"

  plane-worker:
    image: makeplane/plane-backend:stable
    container_name: plane-worker
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    depends_on:
      - plane-api
    environment:
      SECRET_KEY: ${PLANE_SECRET_KEY}
      DATABASE_URL: postgresql://plane:${PLANE_DB_PASSWORD}@postgres:5432/plane
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - internal

  # ── ERPNext (ERP + Indian GST, GPL-3.0) ──────────────────────
  erpnext:
    image: frappe/erpnext:v15
    container_name: erpnext
    restart: unless-stopped
    depends_on:
      - erpnext-mariadb
      - redis
    environment:
      FRAPPE_SITE_NAME_HEADER: erp.${BASE_DOMAIN}
      BACKEND: erpnext-backend:8000
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext.rule=Host(`erp.${BASE_DOMAIN}`)"
      - "traefik.http.routers.erpnext.entrypoints=websecure"
      - "traefik.http.routers.erpnext.tls.certresolver=letsencrypt"
      - "traefik.http.services.erpnext.loadbalancer.server.port=8080"

  erpnext-backend:
    image: frappe/erpnext:v15
    container_name: erpnext-backend
    restart: unless-stopped
    command: bench serve --port 8000
    depends_on:
      - erpnext-mariadb
    environment:
      DB_HOST: erpnext-mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_QUEUE: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_SOCKETIO: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    networks:
      - internal

  # ERPNext requires MariaDB (not compatible with PostgreSQL)
  erpnext-mariadb:
    image: mariadb:10.6
    container_name: erpnext-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MARIADB_ROOT_PASSWORD}
      MYSQL_USER: erpnext
      MYSQL_PASSWORD: ${ERPNEXT_DB_PASSWORD}
      MYSQL_DATABASE: erpnext
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - erpnext_mariadb_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ERPNEXT_MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  erpnext-scheduler:
    image: frappe/erpnext:v15
    container_name: erpnext-scheduler
    restart: unless-stopped
    command: bench schedule
    depends_on:
      - erpnext-backend
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    networks:
      - internal

  # ── Flexprice (SaaS billing + Razorpay, AGPL-3.0) ────────────
  flexprice:
    image: flexprice/flexprice:latest
    container_name: flexprice
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flexprice:${FLEXPRICE_DB_PASSWORD}@postgres:5432/flexprice?sslmode=disable
      APP_SECRET_KEY: ${FLEXPRICE_SECRET_KEY}
      APP_BASE_URL: https://billing.${BASE_DOMAIN}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flexprice.rule=Host(`billing.${BASE_DOMAIN}`)"
      - "traefik.http.routers.flexprice.entrypoints=websecure"
      - "traefik.http.routers.flexprice.tls.certresolver=letsencrypt"
      - "traefik.http.services.flexprice.loadbalancer.server.port=8080"
      - "traefik.http.routers.flexprice.middlewares=authentik@file"

volumes:
  erpnext_sites:
  erpnext_logs:
  erpnext_mariadb_data:
